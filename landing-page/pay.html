<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Farm — Secure Payment Checkout</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card {
      background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 32px; max-width: 440px; width: 100%; text-align: center;
    }
    .brand { font-size: 1.4rem; font-weight: 800; color: #15803d; margin-bottom: 8px; }
    .status-text { color: #64748b; font-size: 0.95rem; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #15803d;
      border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">On-Farm Secure Payments</div>
    <div class="spinner" id="spinner"></div>
    <div id="status" class="status-text">Cashfree Secure Checkout load ho raha hai...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id') || urlParams.get('session');

    if (!sessionId) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = 'Error: Invalid payment session. Kripya app se dubara try karein.';
    } else {
      try {
        const cashfree = Cashfree({ mode: "production" });
        cashfree.checkout({
          paymentSessionId: sessionId,
          redirectTarget: "_self"
        }).then(function(result) {
          if (result && result.error) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Payment Error: ' + result.error.message;
          }
        });
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').textContent = 'Payment load failed: ' + err.message;
      }
    }
  </script>
</body>
</html>
