<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Farm — Secure Payment Checkout</title>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .brand-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #052e16;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: #052e16;
      letter-spacing: -0.02em;
    }
    .status-text {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #00ff99;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 16px auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge-secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── SUCCESS VIEW ── */
    .success-icon-wrap {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #052e16;
      border: 3px solid #00ff99;
      box-shadow: 0 0 25px rgba(0, 255, 153, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .success-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #052e16;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .order-ref-badge {
      display: inline-block;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #334155;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      background: #00ff99;
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 255, 153, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-return:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 255, 153, 0.45);
    }
  </style>
</head>
<body>
  <!-- Checkout Card -->
  <div class="card" id="checkoutCard">
    <div class="brand-wrap">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00ff99" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22V8" />
          <path d="M12 8C9.5 5 6 4.5 6 4.5S6.5 8 9 10.5c2.5 2.5 3 4 3 4" />
          <path d="M12 12c-2.5-3-6-3.5-6-3.5S6.5 12 9 14.5c2.5 2.5 3 3.5 3 3.5" />
          <path d="M12 8c2.5-3 6-3.5 6-3.5s-.5 3.5-3 6c-2.5 2.5-3 4-3 4" />
          <path d="M12 12c2.5-3 6-3.5 6-3.5s-.5 3.5-3 6c-2.5 2.5-3 3.5-3 3.5" />
        </svg>
      </div>
      <div class="brand-text">On-Farm Payments</div>
    </div>
    <div class="spinner" id="spinner"></div>
    <div id="status" class="status-text">Loading Secure Checkout... Please wait.</div>
    <div>
      <span class="badge-secure">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        256-Bit SSL Encrypted
      </span>
    </div>
  </div>

  <!-- Success Card -->
  <div class="card" id="successCard" style="display: none;">
    <div class="success-icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00ff99" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
    </div>
    <div class="success-title">Payment Successful!</div>
    <div class="status-text">Your payment has been received and verified.</div>
    <div class="order-ref-badge" id="orderRefDisplay"></div>
    <button class="btn-return" onclick="window.close()">Return to On-Farm App</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id') || urlParams.get('orderId');
    const sessionId = urlParams.get('session_id') || urlParams.get('session');

    if (orderId) {
      document.getElementById('checkoutCard').style.display = 'none';
      document.getElementById('successCard').style.display = 'block';
      document.getElementById('orderRefDisplay').textContent = 'Order Reference: ' + orderId;

      // Trigger server verify in background for instant confirmation
      fetch('https://on-farm.vercel.app/api/pay/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId })
      }).catch(() => {});
    } else if (!sessionId) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = 'Error: Invalid payment session. Please try initiating checkout from the app again.';
      document.getElementById('status').style.color = '#dc2626';
    } else {
      try {
        const cashfree = Cashfree({ mode: "production" });
        cashfree.checkout({
          paymentSessionId: sessionId,
          redirectTarget: "_self"
        }).then(function(result) {
          if (result && result.error) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Payment Error: ' + result.error.message;
            document.getElementById('status').style.color = '#dc2626';
          }
        });
      } catch (err) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').textContent = 'Payment load failed: ' + err.message;
        document.getElementById('status').style.color = '#dc2626';
      }
    }
  </script>
</body>
</html>
